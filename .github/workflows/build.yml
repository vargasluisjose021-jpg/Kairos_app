name: Build Kairos APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Patch Isar namespace (Workaround for AGP 8+)
        run: |
          sed -i '/^android {/a\    namespace "io.isar.isar_flutter_libs"' /home/runner/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle
          sed -i 's/package="dev.isar.isar_flutter_libs"//g' /home/runner/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --debug --target-platform android-arm64
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kairos-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
